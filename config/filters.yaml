# Фильтры парсера. Файл перечитывается при перезапуске контейнера.
# Сравнение без учёта регистра, по подстроке. Ё = е.

# Сразу в мусор, без LLM (экономит токены)
stopWords:
  - оплата после запуска
  - оплата по факту запуска
  - за отзыв
  - за отзывы
  - бесплатное тестовое
  - тестовое задание бесплатно
  - без оплаты
  - на процент
  - за долю
  - стартап без бюджета
  - ищу партнера
  - ищем партнера
  - платежн        # платежи пока не берём
  - эквайринг
  - персональные данные
  - 1с-битрикс     # уберите, если готовы браться
  - дипломн
  - курсовая
  - курсовую
  - накрутк
  - казино
  - ставки на спорт
  - обнал

# Широкий фильтр «смогу быстро сделать». Пустой список = пропускать всё, решит LLM.
includeKeywords:
  - react
  - next
  - typescript
  - javascript
  - " js "
  - vue
  - фронтенд
  - frontend
  - верстк
  - html
  - css
  - лендинг
  - сайт
  - wordpress
  - вордпресс
  - тильд
  - tilda
  - node
  - nest
  - бот
  - telegram
  - телеграм
  - парсер
  - парсинг
  - скрипт
  - интеграц
  - api
  - админк
  - crm
  - amocrm
  - битрикс24
  - google sheets
  - таблиц
  - docker
  - деплой
  - vps
  - доработ
  - исправить
  - баг

# Свои ниши: заказ получает ⭐ и тег
niches:
  editor: [tiptap, prosemirror, редактор, wysiwyg, блочный, confluence, notion-подоб]
  esign: [эцп, криптопро, cryptopro, рутокен, rutoken, электронная подпись, госуслуг]
  cabinet: [личный кабинет, " лк "]
  microfrontends: [микрофронт, module federation, microfrontend]
  tables: [tanstack, ag-grid, ag grid]

# Telegram-каналы с заказами (только чтение). Сюда или в TG_CHANNELS в .env.
telegramChannels: []
#  - "@some_freelance_channel"

# Профиль для LLM-оценки и черновика отклика
profile: |
  Владислав, фулстек на TypeScript, 7+ лет коммерческой разработки (основа: Senior Frontend, React/TypeScript).
  Работаю через ИП: договор, счёт, акт.
  Сильное: React, TypeScript, Next.js, блочные редакторы на Tiptap, интеграция КриптоПро и Рутокен (ЭЦП),
  архитектура (FSD, микрофронтенды на Module Federation), TanStack Table, CI/CD.
  Также делаю: вёрстку, WordPress/Тильду, Node.js/NestJS, Telegram-боты (grammY), парсеры, интеграции по API,
  небольшие CRUD-админки, Docker и деплой на VPS.
  Не беру: платежи и чувствительные персональные данные, «оплату после запуска», работу за отзыв,
  бесплатные тестовые, задачи без описания, большие проекты с маленьким бюджетом.
  Предпочитаю небольшие понятные задачи, где можно быстро сдать результат.
